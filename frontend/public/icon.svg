<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16"/>

  <!-- Glowing Terminal Bracket Left `<` -->
  <path d="M210 160 L120 256 L210 352" fill="none" stroke="url(#primaryGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Glowing Terminal Bracket Right `>` -->
  <path d="M302 160 L392 256 L302 352" fill="none" stroke="url(#primaryGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Electric Center Slash / Lightning -->
  <path d="M280 150 L232 362" fill="none" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Top Champion Crown Dot -->
  <circle cx="256" cy="110" r="18" fill="url(#accentGrad)" filter="url(#glow)"/>
</svg>
